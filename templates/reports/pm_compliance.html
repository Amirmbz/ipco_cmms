{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "PM Compliance" %}{% endblock %}
{% block content %}
<h2 class="subtitle">{% trans "PM Compliance" %}</h2>
<form method="get" action="/api/reports/pm-compliance/">
    <div class="field"><label class="label">Plant</label><input class="input" type="text" name="plant"></div>
    <div class="field"><label class="label">Start</label><input class="input" type="date" name="start"></div>
    <div class="field"><label class="label">End</label><input class="input" type="date" name="end"></div>
    <button class="button is-primary" type="submit">{% trans "Run" %}</button>
    <a class="button" href="/api/reports/pm-compliance/?export=csv">{% trans "Export to Excel" %}</a>
</form>
{% endblock %}
