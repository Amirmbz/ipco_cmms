{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Workorder Status Summary" %}{% endblock %}
{% block content %}
<h2 class="subtitle">{% trans "Workorder Status Summary" %}</h2>
<form method="get" action="/api/reports/workorder-status-summary/">
    <div class="field"><label class="label">Plant</label><input class="input" type="text" name="plant"></div>
    <div class="field"><label class="label">Department</label><input class="input" type="text" name="department"></div>
    <div class="field"><label class="label">Status</label><input class="input" type="text" name="status"></div>
    <div class="field"><label class="label">Start</label><input class="input" type="date" name="start"></div>
    <div class="field"><label class="label">End</label><input class="input" type="date" name="end"></div>
    <button class="button is-primary" type="submit">{% trans "Run" %}</button>
    <a class="button" href="/api/reports/workorder-status-summary/?export=csv">{% trans "Export to Excel" %}</a>
</form>
{% endblock %}
