{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Workorders by Technician" %}{% endblock %}
{% block content %}
<h2 class="subtitle">{% trans "Workorders by Technician" %}</h2>
<form method="get" action="/api/reports/workorder-by-technician/">
    <div class="field"><label class="label">Technician ID</label><input class="input" type="text" name="technician"></div>
    <div class="field"><label class="label">Start</label><input class="input" type="date" name="start"></div>
    <div class="field"><label class="label">End</label><input class="input" type="date" name="end"></div>
    <button class="button is-primary" type="submit">{% trans "Run" %}</button>
    <a class="button" href="/api/reports/workorder-by-technician/?export=csv">{% trans "Export to Excel" %}</a>
</form>
{% endblock %}
